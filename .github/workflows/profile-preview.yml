name: Profile PR preview

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - docs/**
      - scripts/preview_profile.py
      - requirements-preview.txt
      - tests/**
      - .github/workflows/profile-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing profile tests
        run: python -m unittest discover -s tests -v
      - name: Validate local links, SVGs and generated-region markers
        run: python scripts/preview_profile.py --check-only
      - name: Install Markdown preview renderer
        run: python -m pip install -r requirements-preview.txt
      - name: Render offline HTML preview
        run: python scripts/preview_profile.py --output profile-preview
      - name: Add one-click native preview links to run summary
        env:
          PREVIEW_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '### One-click GitHub profile preview'
            echo ''
            echo "[View rendered README](https://github.com/${GITHUB_REPOSITORY}/blob/${PREVIEW_REF}/README.md)"
            echo ''
            echo "[View engineering evidence](https://github.com/${GITHUB_REPOSITORY}/blob/${PREVIEW_REF}/docs/engineering.md)"
            echo ''
            echo 'The HTML Artifact is optional; GitHub renders the Markdown and SVG directly at these links.'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload browsable preview
        uses: actions/upload-artifact@v4
        with:
          name: profile-preview
          path: profile-preview/
          if-no-files-found: error
          retention-days: 14
